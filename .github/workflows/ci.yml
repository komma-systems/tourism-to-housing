name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Contracts (compile + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm install (not ci): the lockfile pins macOS-only fsevents, which npm ci
      # rejects on Linux runners.
      - run: npm install --no-audit --no-fund
      - name: Compile (solc wasm)
        run: npm run compile
      - name: Test (in-memory EVM)
        run: npm test

  app:
    name: App (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build static export
        run: npm run build
